  <style>

<body>
  <aside class="intro"><div class="eyebrow">这片海我包了 · 怪人营地</div><h1>别人出门开车，<br>我们开着家走。</h1><picture><source srcset="assets/webp/shark-v4.webp" type="image/webp"><img class="mascot" src="assets/shark-v4.png" alt="机械鲨鱼背上的多层海上合租营地"></picture><p>阿昊背着咖啡馆来旅行，怪人们等他一起开饭。<br>捞木头、修小屋、尝怪饮料，拍一张全家福。</p><div class="tags">经营 · 怪人故事 · 装饰 · 合影</div><small>这片海我包了 v1.2 / 浏览器试玩<br>进度自动保存在当前浏览器。</small></aside>

  <script>try{window.tidehaven=TideApp.start(TideCore,TideView,TidePlatform.browser(document.getElementById('game')))}catch(e){document.getElementById('boot-error').style.display='block';document.getElementById('boot-error').textContent='启动失败，请刷新页面。\n'+e.message;console.error(e)}</script>
