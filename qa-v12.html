<meta charset="utf-8"><title>v1.2 独立演示存档</title><style>body{margin:0;background:#123c47;color:white;font:14px sans-serif;display:flex;gap:20px}canvas{width:390px;height:844px;flex-shrink:0;touch-action:none}aside{max-width:420px}button{margin:5px;padding:10px}</style><canvas id="game"></canvas><aside><h2>v1.2 独立演示 · 不读写玩家存档</h2><div id="controls"></div></aside><script src="src/core.js"></script><script src="src/view.js"></script><script src="src/platform.js"></script><script src="src/app.js"></script><script>
const C=TideCore,n=Date.now(),s=C.fresh(n);s.introSeen=true;s.camp.stage=3;s.home.rooms=C.ROOMS.map(r=>r.id);s.home.resident=true;s.life.author=true;s.camp.meals=1;s.salvager.built=true;for(const k in s.resources)s.resources[k]=200;['filter','fishery','eel','puffer','manatee','mixer'].forEach((kind,i)=>C.act(s,{type:'build',kind,plot:s.plots[i]},n));if(new URLSearchParams(location.search).has('complete'))s.tower.rooms=C.SKY_ROOMS.map(r=>r.id);const p=TidePlatform.browser(game);let memory=C.serialize(s),tap;p.read=()=>memory;p.write=(k,v)=>memory=v;const gesture=p.onGesture;p.onGesture=f=>{gesture(f);tap=(x,y)=>{f({phase:'start',x,y});f({phase:'end',x,y});}};const app=TideApp.start(C,TideView,p);let old='';setInterval(()=>{const hits=app.hitTargets().filter(h=>h.event),key=JSON.stringify(hits);if(key===old)return;old=key;controls.replaceChildren(...hits.map(h=>{const b=document.createElement('button');b.textContent=h.label;b.onclick=()=>tap(h.x+h.w/2,h.y+h.h/2);return b}));},250);
</script>
